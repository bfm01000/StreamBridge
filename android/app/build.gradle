apply plugin: "com.android.application"

android {
    namespace "com.streambridge.android"
    compileSdk 37

    defaultConfig {
        applicationId "com.streambridge.android"
        minSdk 26
        targetSdk 37
        versionCode 1
        versionName "0.1.0"

        externalNativeBuild {
            ndkBuild {
                arguments "APP_STL=c++_shared"
                cppFlags "-std=c++17 -Wall -Wextra -Werror"
            }
        }

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    externalNativeBuild {
        ndkBuild {
            path "../native/Android.mk"
        }
    }
}
